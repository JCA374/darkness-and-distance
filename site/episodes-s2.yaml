- n: 0
  title: The Only One There
  summary: Last season Tessa Lind said she believed the letters. Then a psychiatrist wrote to ask whether she had ever read them as if the dying man on the ice was the only one there.
  notes:
  - Start here.
- n: 1
  title: A Double Existence
  summary: A letter from Dr Marian Kessler, and a new question for an old case. In Kent, a paper conservator looks at the first letters, and a captain describes his guest's eyes, "wildness, and even madness".
  notes:
  - 'Found: a conservator''s report on Walton''s letter of August 5th.'
  - Introducing Dr Marian Kessler, forensic psychiatrist. She doesn't diagnose the dead.
  - '"Remember, I am not recording the vision of a madman."'
- n: 2
  title: The Fever
  summary: Ingolstadt. Two years of work with the dead, a November night, a figure at the bedside, and a winter of fever in which Victor raved about a monster his friend never saw.
  notes:
  - 'Found: a professor''s note in a university archive in Munich, "ill of a fever".'
  - Henry Clerval at the bottom of the stairs.
  - The town minute about robbed vaults, read again.
- n: 3
  title: My Own Spirit
  summary: William Frankenstein dies on Plainpalais. Where was Victor that night? A figure in the lightning, and Victor's own words for it, "my own spirit let loose from the grave".
  notes:
  - 'A dead end: no paper for a walking tour.'
  - Dr Paul Okafor on what a hand can do.
  - Henry, the witness who never speaks.
- n: 4
  title: The Ravings of a Madman
  summary: Justine Moritz on trial, with Victor in the courtroom hearing every detail of her night in a barn. He says he wanted to confess, and would have been taken for a madman.
  notes:
  - 'Found: a Geneva prison register.'
  - The clerk's line, "woken by steps", read again.
  - '"I, not in deed, but in effect, was the true murderer."'
- n: 5
  title: Two Voices
  summary: On a glacier above Chamounix, the creature tells its story. Tessa lays the barn passage beside the trial record, and the conservator says where Victor's own ink is.
  notes:
  - 'Found: the conservator''s count of the second ink.'
  - The Felix and Safie letters, which Victor could not have written.
- n: 6
  title: The Window
  summary: An island in the Orkneys, a face at a window that only Victor saw, and a threat. Then an Irish beach, Henry Clerval, and a grand jury's finding the theory can't get round.
  notes:
  - 'Found: a kirk session minute in Kirkwall.'
  - Victor's ravings in an Irish prison.
  - The timeline, with Dr Reber and Dr Okafor.
- n: 7
  title: Evian
  summary: Elizabeth Lavenza, the wedding, and a night at an inn on the lake with a pistol in Victor's coat. The theory at full strength, and what it costs.
  notes:
  - 'Found: the Savoy death register, read again, and a register in Geneva.'
  - '"Do you not love another?"'
  - The searchers on the lake.
- n: 8
  title: Darkness and Distance
  summary: Words cut into trees, food in the desert, a last village on the Arctic shore, and the ship. Then one more page of Walton's, which Victor never touched.
  notes:
  - 'Found: the conservator''s report on the last letter.'
  - The three doors, laid out.
  - What Tessa believes now, and what stays open.
