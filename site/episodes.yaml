- n: 0
  title: Could It Be True?
  summary: Two minutes. A sea captain's letters from the Arctic describe five deaths, a young woman executed for one of them, and a suspect last seen on the ice. For a year, Tessa Lind checked them against
    every record she could find. The more she learned, the stranger it got, and the more of it checked out.
  notes:
  - Start here.
- n: 1
  title: The Man on the Ice
  summary: A sea chest in Kent holds a captain's letters from the Arctic. His crew saw a giant on a dog sledge; the next morning they pulled a dying man off the ice, and the man began a statement that he
    later corrected in a second ink.
  notes:
  - 'Found: Margaret Saville''s notes on the backs of the letters, in a box from Judith''s loft.'
  - 'Robert Walton''s letters to his sister, Mrs Margaret Saville: St Petersburg, Archangel, then the ice. Every year is written "17—".'
  - 'July 31st: the sledge sighting, the only group sighting that does not reach us through Victor.'
  - 'The three layers: Walton''s letters, Victor''s statement, the creature''s statement inside it.'
  - Introducing Judith Saville, and the readers who voice the documents.
- n: 2
  title: Plainpalais
  summary: Three days in Geneva. Tessa finds William Frankenstein in the city's burial register, reads his father's letter on the plain where he was found, and walks Victor's route through the night of the storm, to the place where Victor says he saw a giant in a lightning flash.
  notes:
  - 'Found: William''s entry in the Geneva burial register, with Dr Anselm Reber.'
  - Alphonse Frankenstein's letter of May 12th, read on Plainpalais at dusk.
  - Dr Paul Okafor on what "the print of the murder's finger" can and cannot tell us.
  - From Secheron to Plainpalais at midnight, and the figure on the Salêve.
- n: 3
  title: All Black
  summary: Justine Moritz, raised in the Frankenstein house, is tried for William's murder. The jewel is in her pocket. Elizabeth speaks for her; the ballots are all black; a confession is signed after
    the verdict and taken back the same day. She dies the next morning.
  notes:
  - 'Found: the trial file and the sentence register, read in the Geneva archives.'
  - 'Dr Anselm Reber reads the clerk''s note of Justine''s defence: the barn, and the steps.'
  - The false confession and the confessor's threats.
  - '"I, not in deed, but in effect, was the true murderer."'
- n: 4
  title: The Workshop
  summary: What Victor says he did at Ingolstadt. Two years of remains taken from vaults, charnel houses and the dissecting room; a November night; a figure at his bedside; months of fever. We can't test
    the science. We can test the crime, and the timeline.
  notes:
  - 'Found: Victor''s and Henry''s names in the Ingolstadt university register, and a town minute about robbed vaults, "the doer unknown".'
  - Body-snatching in that century, and what Victor was risking.
  - The case for a hallucination, put fairly, and what it can't explain.
  - Henry Clerval arrives the morning after.
- n: 5
  title: The Suspect's Statement
  summary: On a glacier above Chamounix, the creature tells Victor its life, and its own account of the evening William died. Every word has passed through Victor's
    pen. We check it against records he never touched.
  notes:
  - 'Found: the Paris police papers on the De Lacey family, the record that backs up the suspect''s own story.'
  - The De Lacey family, Safie, and the letters of Felix and Safie that Walton held in his hands.
  - Victor's laboratory journal, handed back in the hut, and now lost.
  - 'The trial file, read again.'
- n: 6
  title: The Irish Shore
  summary: Victor destroys the half-made female on an Orkney island. "I shall be with you on your wedding-night." Days later he lands in Ireland, is taken before a magistrate, and is led to a coffin. Inside
    it is Henry Clerval, strangled, with the mark of fingers on his neck.
  notes:
  - 'A dead end in Ireland, and a Geneva notary''s line: Henry Clerval, "deceased in Ireland".'
  - The depositions of the fishermen and Daniel Nugent.
  - The grand jury and the Orkney alibi.
  - 'Open: two boats, and how Henry got from Perth to Ireland.'
- n: 7
  title: Evian
  summary: Elizabeth Lavenza, the bravest person in this story, marries Victor at last. They cross the lake to spend the night at an inn at Evian, and Victor
    carries a pistol.
  notes:
  - 'Found: a parish register in Savoy, and an officer''s note of a search.'
  - 'Elizabeth''s letter of May 18th: "Do you not love another?"'
  - The case against Victor, at full strength.
  - A Geneva judge who treats Victor's statement as delirium.
- n: 8
  title: Darkness and Distance
  summary: The chase north, the ship in the ice, Victor's death, and a midnight scene in a cabin that Walton witnessed alone and wrote down unedited. What the documents can carry, what they can't, and where
    the suspect was last seen.
  notes:
  - 'Found: Lloyd''s List, "Robert is home", and a note filed beside Justine''s name.'
  - 'The one clean layer: the creature''s words to Walton with Victor dead in the coffin.'
  - What we're confident of, and what stays open.
  - Justine Moritz's name is still in the Geneva register.
